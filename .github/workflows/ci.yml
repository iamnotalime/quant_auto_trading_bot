name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hft-core:
    name: Rust HFT core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
      - name: Verify formatting
        run: cargo +1.97.0 fmt --manifest-path hft_core/Cargo.toml --all -- --check
      - name: Run all Rust tests
        run: cargo +1.97.0 test --locked --manifest-path hft_core/Cargo.toml --all-targets --all-features
      - name: Run strict Clippy
        run: cargo +1.97.0 clippy --locked --manifest-path hft_core/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Build optimized hot-path artifacts
        run: cargo +1.97.0 build --release --locked --manifest-path hft_core/Cargo.toml --all-targets --all-features

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q app.py bot.py bot_dashboard.py auto_trader quant_app tests
      - name: Run full test suite
        run: python -m pytest -q

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install hash-locked audit environment
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Audit the production lock
        run: python -m pip_audit -r requirements.lock --progress-spinner off

  container-build:
    name: Hardened container build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BOT_ENV_FILE: .env.example
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate Compose model
        run: docker compose --profile research --env-file .env.example config --quiet
      - name: Build all hash-locked images
        run: docker compose --profile research --env-file .env.example build
