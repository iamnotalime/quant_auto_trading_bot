version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: cargo
    directory: "/hft_core"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Direct requirements are exact-pinned; reviewed update PRs must regenerate both
  # hash-locked files with pip-tools before merge.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
